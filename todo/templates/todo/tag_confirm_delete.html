{% extends "base.html" %}

{% block title %}Delete tag{% endblock %}

{% block content %}
  <h1 class="h3 mb-4">Delete tag</h1>
  <p>Are you sure you want to delete the tag <strong>{{ object.name }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'todo:tag-list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
{% endblock %}
