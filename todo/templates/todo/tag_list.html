{% extends "base.html" %}

{% block title %}Tags{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Tags</h1>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add tag</a>
  </div>

  <table class="table table-hover align-middle">
    <thead>
      <tr>
        <th>Name</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tags %}
        <tr>
          <td>{{ tag.name }}</td>
          <td class="text-end">
            <a href="{% url 'todo:tag-update' tag.pk %}" class="btn btn-outline-primary btn-sm">Edit</a>
            <a href="{% url 'todo:tag-delete' tag.pk %}" class="btn btn-outline-danger btn-sm">Delete</a>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="2" class="text-muted">There are no tags yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
