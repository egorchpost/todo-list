{% extends "base.html" %}

{% block title %}Delete task{% endblock %}

{% block content %}
  <h1 class="h3 mb-4">Delete task</h1>
  <p>Are you sure you want to delete this task?</p>
  <blockquote class="border-start ps-3 text-muted">{{ object.content|linebreaksbr }}</blockquote>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'todo:task-list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
{% endblock %}
